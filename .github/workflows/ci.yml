# PR 检查：格式 → 测试 → 构建。任何一步失败，PR 页面会显示红叉。
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
